[project]
name = "mediadubflow"
version = "0.1.0"
description = "AI-powered desktop tool for automatically localizing movies and drama episodes into Khmer"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Proseth Solutions Co., Ltd" }]
requires-python = ">=3.13"

dependencies = [
    # GUI
    "PySide6>=6.8.0",

    # Speech-to-Text
    "faster-whisper>=1.1.0",


    # Translation (LLM clients)
    "openai>=1.56.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",

    # Audio / Video processing
    "ffmpeg-python>=0.2.0",

    # numpy pinned >= 2.0 — pre-built wheels exist for Python 3.13 on Windows.
    # numpy 1.x has no py3.13 wheel and requires a C compiler to build.
    "numpy>=2.0.0",

    # Database & ORM
    # sqlalchemy[asyncio] pulls in 'greenlet' required by the async extension.
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",


    # Config / settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",

    # Logging
    "loguru>=0.7.0",

    # Subtitle handling
    "pysrt>=1.1.2",
    "ass>=0.5.2",

    # Utilities
    "tqdm>=4.67.0",
    "click>=8.1.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
# Phase 2: speaker diarization — install with: uv sync --extra phase2
# Requires HF_TOKEN in .env for pyannote model download.
phase2 = [
    "pyannote.audio>=3.3.0",
]

# NOTE: Coqui TTS (TTS>=0.22.0) is NOT listed here because it is incompatible
# with Python 3.13 — its dependency gruut requires numpy<2.0 which conflicts
# with onnxruntime's Python 3.13 wheels. Khmer TTS options will be evaluated
# and added in Phase 2 once a compatible package is identified.

[project.scripts]
mediadubflow = "mediadubflow.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/mediadubflow --cov-report=term-missing"
